<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#2E6F57">
  <meta name="robots" content="noindex, nofollow">
  <title>HAYATIQ · Website Questions</title>
  <link rel="icon" type="image/webp" href="images/logo-small.webp">

</head>
<body>
  <header class="top">
    <div class="top-row">
      <div class="brand"><img class="logo" src="images/logo-small.webp" alt="" width="40" height="40"><span><b>HAYATIQ</b><small>Website questions &amp; plan</small></span></div>
      <span id="saveState" class="save" aria-live="polite"><span class="dot" aria-hidden="true"></span><span>Saves by itself</span></span>
    </div>
    <a id="strip" class="strip" href="#q" hidden aria-label="Overall progress. Tap to see all topics.">
      <span class="strip-text"><b id="stripPct">0%</b> answered overall · <span id="stripLeft"></span></span>
      <span class="bar thin"><i id="stripBar"></i></span>
    </a>
  </header>

  <nav class="tabs" aria-label="Main">
    <a href="#q" data-tab="q"><span class="ico-wrap"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4.5V3.8A1.3 1.3 0 0 1 10.3 2.5h3.4A1.3 1.3 0 0 1 15 3.8v.7"/><path d="m8.5 11 1.6 1.6L13 9.7"/><path d="M8.5 16.5h7"/></svg><span class="tab-badge" id="tabBadge" hidden></span></span><span class="tab-label">Questions</span></a>
    <a href="#plan" data-tab="plan"><span class="ico-wrap"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4.5 3.5 6.6v13l5.5-2.1 6 2.5 5.5-2.1v-13L15 7Z"/><path d="M9 4.5v13"/><path d="M15 7v13"/></svg></span><span class="tab-label">Our Plan</span></a>
    <a href="#road" data-tab="road"><span class="ico-wrap"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"/><path d="M5 4.5h11.5l-2 3.8 2 3.7H5"/></svg></span><span class="tab-label">Roadmap</span></a>
  </nav>

  <main>
    <section id="tab-q" class="tab" aria-label="Questions"></section>
    <section id="tab-plan" class="tab" aria-label="Our Plan" hidden></section>
    <section id="tab-road" class="tab" aria-label="Roadmap" hidden></section>
  </main>

  <a id="backChip" class="back-chip" href="#" hidden></a>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p class="card">This page needs JavaScript turned on.</p></noscript>
  <script src="js/questions.js?v=4"></script>
